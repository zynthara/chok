# goreleaser.yaml
#
# Triggered by pushing a v* tag. Builds the chok CLI for the common host
# platforms, packages it, and creates a GitHub Release with the artefacts
# attached.
#
# Local dry-run:    goreleaser release --snapshot --clean --skip=publish
#                   (needs goreleaser and syft)
# CI run:           .github/workflows/goreleaser.yml on tag push

version: 2

project_name: chok

# No `before.hooks` here. `go mod tidy -diff` is already a gate of
# `make verify` (CI's verify job), so re-running tidy inside the release
# pipeline could only rewrite go.sum. The release binary reports the tag
# stamped below, never the runner's working tree: `chok version` ignores
# vcs.modified once main.version is set.

builds:
  - id: chok
    main: ./cmd/chok
    binary: chok
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # cmd/chok's own variables (v3 has no version package): `chok version`
    # and `chok init`, which requires the tag in the go.mod it writes,
    # read them. The tag keeps its v; the date is the commit's, so a
    # rebuild of the same tag is the same binary.
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: chok
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

sboms:
  # One SPDX JSON document per archive, generated by syft (installed in
  # the release workflow via anchore/sbom-action/download-syft; a local
  # dry-run needs `brew install syft`). Uploaded as release
  # assets alongside the archives.
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # CHANGELOG.md is curated by hand; the GitHub Release notes are the
  # generated commit list, filtered.
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: zynthara
    name: chok
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## chok {{ .Tag }}

    Built {{ .Date }} from commit {{ .ShortCommit }}.

    Install via Go toolchain:

    ```
    go install github.com/zynthara/chok/v3/cmd/chok@{{ .Tag }}
    ```

    Or download the binary for your platform below.

# Future: brews / scoops / nfpms blocks once package channels exist.
