# CI runs exactly what a local `make verify` runs: tidy / gofmt / vet /
# golangci-lint / go fix, the SQLite suite, the Postgres and MySQL lanes,
# the API budget and (from WP5) the examples/blog smoke test. Every gate
# blocks; nothing here is advisory.

name: ci

on:
  push:
    branches:
      - main
      # Work-package branches get CI before they are fast-forwarded onto main.
      - "wp*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The three dialects are peers: the SQLite suite runs in-process, and the
    # DB-backed packages rerun in full against both services below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chok
          POSTGRES_PASSWORD: chok
          POSTGRES_DB: choktest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: choktest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Honour the go / toolchain directives in go.mod so CI never
          # silently runs an older toolchain than the module declares.
          go-version-file: go.mod
          cache: true

      # Built from source with the toolchain above, because a prebuilt
      # binary compiled with an older Go refuses to lint a go 1.27 module.
      # Keep the version in step with GOLANGCI_LINT_VERSION in the Makefile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          install-only: true

      - name: make verify
        env:
          CHOK_TEST_PG_DSN: postgres://chok:chok@localhost:5432/choktest?sslmode=disable
          CHOK_TEST_MYSQL_DSN: root:root@tcp(localhost:3306)/?parseTime=true
        run: make verify
