# blog — the chok quickstart.
#
# Every key is checked: a misspelled one fails startup with a suggestion.
# Every key can also be set from the environment, named after its path:
# BLOG_HTTP_ADDR, BLOG_DB_SQLITE_PATH, BLOG_AUTH_SIGNING_KEY, ...
log:
  level: info

http:
  addr: ":8080"
  # Behind a reverse proxy (nginx, a load balancer, a CDN), list its
  # addresses or CIDRs here: otherwise X-Forwarded-For is ignored, every
  # client has the proxy's address, and the login throttle below counts
  # them all as one.
  # trusted_proxies: ["127.0.0.1", "10.0.0.0/8"]
  openapi:
    title: Blog API

db:
  driver: sqlite
  sqlite:
    path: blog.db
  store:
    # Writing an owned row without a logged-in user fails closed.
    require_principal: true

auth:
  # signing_key is a secret of at least 32 bytes: set it through
  # BLOG_AUTH_SIGNING_KEY instead of writing it here.
  token_ttl: 2h
  # Ten failed logins in 15 minutes per email, and a hundred per address
  # (shared by everyone behind one NAT or proxy), answer 429 until the
  # window slides.
  login_rate_window: 15m
  login_rate_limit: 10
  login_rate_limit_per_ip: 100

telemetry:
  # Request and SQL metrics for Prometheus, on a port of their own that
  # only this host reaches: GET http://127.0.0.1:9464/metrics. Set addr
  # to :9464 for a Prometheus on another host or in another container.
  metrics:
    enabled: true
  # Spans for every request and statement: turn them on with a collector
  # to receive them (exporter: otlp, endpoint: http://localhost:4318),
  # or with exporter: stdout to watch them in the terminal.
  tracing:
    enabled: false
