<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatter — chok realtime example</title>
<style>
  :root { --ink: #1d232a; --muted: #6b7480; --line: #e3e6ea; --bg: #f7f8fa; --card: #fff; --accent: #2f6fde; --bad: #c2410c; --ok: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 1rem; padding: .8rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin: 0; font-size: 1.15rem; }
  header small, .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: 220px 1fr 300px; gap: 1rem; padding: 1rem 1.2rem; height: calc(100vh - 3.4rem); }
  section, aside { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .8rem; display: flex; flex-direction: column; min-height: 0; }
  h2 { margin: 0 0 .6rem; font-size: .95rem; display: flex; justify-content: space-between; align-items: baseline; }
  ul, ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #rooms li { display: flex; justify-content: space-between; align-items: center; padding: .3rem .2rem; border-radius: 6px; }
  #rooms li.open { background: #eef3fd; }
  #messages li { padding: .35rem 0; border-bottom: 1px solid var(--line); }
  #messages li.bot { color: #4b5563; font-style: italic; }
  #messages b { margin-right: .4rem; }
  #runs li { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: .25rem 0; border-bottom: 1px dashed var(--line); }
  .failed { color: var(--bad); } .finished { color: var(--ok); }
  form { display: flex; gap: .4rem; margin-top: .6rem; }
  input { flex: 1; padding: .45rem .55rem; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { padding: .45rem .8rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.link { background: none; color: var(--accent); padding: 0 .3rem; }
  #login { max-width: 420px; margin: 3rem auto; }
  #login form { flex-wrap: wrap; } #login input { flex-basis: 100%; }
  #login p { margin: .6rem 0 0; }
  .error { color: var(--bad); min-height: 1.2em; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: #c9ced6; margin-left: .3rem; }
  .dot.on { background: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>chatter</h1>
  <small>chok v3 realtime: WebSocket chat, server-sent events for the jobs</small>
  <small id="who" class="muted"></small>
  <button class="link" id="logout" hidden>log out</button>
</header>

<section id="login" hidden>
  <h2>Sign in</h2>
  <form id="askCode">
    <input name="email" type="email" placeholder="email" required autocomplete="email">
    <button>Mail me a code</button>
  </form>
  <form id="enterCode" hidden>
    <input name="code" inputmode="numeric" pattern="[0-9]{6,10}" placeholder="the code from the mail" required autocomplete="one-time-code">
    <button>Sign in</button>
    <button type="button" class="link" id="otherAddress">another address</button>
  </form>
  <p id="codeSent" class="muted" hidden>A code went to <b id="codeTo"></b>; this example writes the mail to a file in /tmp/chatter-mail. The mail's link signs you in too.</p>
  <p id="authError" class="error"></p>
</section>

<main id="app" hidden>
  <aside>
    <h2>Rooms <button class="link" id="refresh" title="reload the list">reload</button></h2>
    <ul id="rooms"></ul>
    <form id="newRoom"><input name="name" placeholder="new room" maxlength="100" required><button>Create</button></form>
  </aside>
  <section>
    <h2><span id="roomName">Pick or create a room</span><small>chat <span id="wsDot" class="dot"></span></small></h2>
    <ol id="messages"></ol>
    <form id="say" hidden><input name="text" placeholder="say something; mention @bot for an answer" maxlength="2000" required autocomplete="off"><button>Send</button></form>
    <p id="chatError" class="error"></p>
  </section>
  <aside>
    <h2>Background jobs <small>events <span id="sseDot" class="dot"></span></small></h2>
    <ol id="runs"></ol>
  </aside>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
let signedIn = false;     // the session cookie works
let email = "";           // the address the code went to
let room = null;          // the open room: {id, name}
let ws = null;            // the chat socket
let lastMessageEvent = ""; // resume point of the chat
let lastRunEvent = "";     // resume point of the jobs panel
let shown = new Set();     // the ids of the messages on screen

// api calls the JSON API. The session is an HttpOnly cookie the browser
// sends by itself: the page never holds a token. Errors carry chok's
// envelope message.
async function api(method, path, body) {
  const opts = {method};
  if (body) {
    opts.headers = {"Content-Type": "application/json"};
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = res.status === 202 || res.status === 204 ? null : await res.json();
  if (res.status === 401 && signedIn) location.reload(); // the session ended: sign in again
  if (!res.ok) throw new Error(data && data.message || res.statusText);
  return data;
}

// ticket is good for one connection, for a minute: one per (re)connect.
async function ticket() { return (await api("POST", "/realtime/ticket")).ticket; }

// ---- signing in: an address, then the code mailed to it ----------------

$("#askCode").addEventListener("submit", async (e) => {
  e.preventDefault();
  email = new FormData(e.target).get("email");
  try {
    await api("POST", "/auth/passwordless/start", {email}); // 202 whatever the address
  } catch (err) { $("#authError").textContent = err.message; return; }
  $("#codeTo").textContent = email;
  $("#askCode").hidden = true;
  $("#enterCode").hidden = $("#codeSent").hidden = false;
  $("#authError").textContent = "";
  $("#enterCode").code.focus();
});

$("#enterCode").addEventListener("submit", (e) => {
  e.preventDefault();
  verify({email, code: new FormData(e.target).get("code")});
});

$("#otherAddress").onclick = () => {
  $("#enterCode").hidden = $("#codeSent").hidden = true;
  $("#askCode").hidden = false;
};

// verify trades the code, or the mail link's token, for the session cookie.
async function verify(body) {
  try {
    await api("POST", "/auth/passwordless/verify", body);
  } catch (err) { $("#authError").textContent = err.message; $("#login").hidden = false; return; }
  start();
}

$("#logout").onclick = async () => { await api("POST", "/auth/logout"); location.reload(); };

async function start() {
  let me;
  try {
    me = await api("GET", "/auth/me");
  } catch { $("#login").hidden = false; return; } // no session yet
  signedIn = true;
  $("#who").textContent = "signed in as " + (me.name || me.email);
  $("#login").hidden = true;
  $("#app").hidden = $("#logout").hidden = false;
  loadRooms();
  connectChat();
  listenToJobs();
}

// ---- rooms -------------------------------------------------------------

async function loadRooms() {
  const page = await api("GET", "/api/rooms?size=100&order=name:asc");
  $("#rooms").replaceChildren(...page.items.map((r) => {
    const li = document.createElement("li");
    li.className = room && room.id === r.id ? "open" : "";
    li.append(r.name);
    const b = document.createElement("button");
    b.className = "link"; b.textContent = "open";
    b.onclick = () => openRoom(r);
    li.append(b);
    return li;
  }));
}

$("#refresh").onclick = loadRooms;

$("#newRoom").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await api("POST", "/api/rooms", {name: new FormData(e.target).get("name")});
  e.target.reset();
  await loadRooms();
  openRoom(r);
});

async function openRoom(r) {
  $("#chatError").textContent = "";
  await api("POST", `/api/rooms/${r.id}/join`); // joining again is fine
  if (room && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({unsubscribe: ["room:" + room.id]}));
  }
  room = r;
  lastMessageEvent = "";
  $("#roomName").textContent = "# " + r.name;
  $("#say").hidden = false;
  // Follow first, then read: a message posted in between arrives live
  // and is not shown twice.
  $("#messages").replaceChildren();
  shown = new Set();
  subscribe();
  await loadHistory();
  loadRooms();
}

// loadHistory shows the room's last messages, followed by those that came
// live while it was reading: on open, and after a reset.
async function loadHistory() {
  const msgs = await api("GET", `/api/rooms/${room.id}/messages`);
  const live = [...$("#messages").children].filter((li) => !msgs.some((m) => m.id === li.dataset.id));
  shown = new Set(msgs.map((m) => m.id));
  live.forEach((li) => shown.add(li.dataset.id));
  $("#messages").replaceChildren(...msgs.map(messageItem), ...live);
  $("#messages").scrollTop = 1e9;
}

function messageItem(m) {
  const li = document.createElement("li");
  li.dataset.id = m.id;
  li.className = m.user_id === "bot" ? "bot" : "";
  const who = document.createElement("b");
  who.textContent = m.author;
  li.append(who, m.text); // text nodes: nothing a user wrote is parsed as HTML
  return li;
}

$("#say").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("POST", `/api/rooms/${room.id}/messages`, {text: new FormData(e.target).get("text")});
    e.target.reset(); // the message itself comes back over the WebSocket
  } catch (err) { $("#chatError").textContent = err.message; }
});

// ---- the chat: one WebSocket, subscribed to the open room ---------------

async function connectChat() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/realtime/ws?ticket=${await ticket()}`);
  ws.onopen = () => { $("#wsDot").classList.add("on"); subscribe(); };
  ws.onclose = () => { $("#wsDot").classList.remove("on"); setTimeout(connectChat, 2000); }; // new ticket, same room
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (!room || ev.topic !== "room:" + room.id) return;
    if (ev.type === "message.created") {
      lastMessageEvent = ev.id;
      if (shown.has(ev.data.id)) return;
      shown.add(ev.data.id);
      $("#messages").append(messageItem(ev.data));
      $("#messages").scrollTop = 1e9;
    } else if (ev.type === "reset") {
      // Too long away for the hub's replay: read the room anew.
      $("#messages").replaceChildren();
      shown = new Set();
      loadHistory();
    } else if (ev.type === "refused") {
      $("#chatError").textContent = ev.data.message;
    }
  };
}

// subscribe follows the open room, resuming after the last event seen.
function subscribe() {
  if (!room || !ws || ws.readyState !== WebSocket.OPEN) return;
  const frame = {subscribe: ["room:" + room.id]};
  if (lastMessageEvent) frame.after = lastMessageEvent;
  ws.send(JSON.stringify(frame));
}

// ---- the jobs panel: server-sent events --------------------------------

async function listenToJobs() {
  // EventSource reconnects by itself, but with the same URL, whose ticket
  // is spent: on error, close it and open a new one, resuming by id.
  const es = new EventSource(`/realtime/sse?topics=jobs&ticket=${await ticket()}&last_event_id=${lastRunEvent}`);
  es.onopen = () => $("#sseDot").classList.add("on");
  es.onerror = () => { $("#sseDot").classList.remove("on"); es.close(); setTimeout(listenToJobs, 3000); };
  es.addEventListener("refused", (e) => console.warn("jobs panel:", JSON.parse(e.data).data.message));
  for (const kind of ["run.started", "run.finished", "run.failed", "run.skipped", "stats"]) {
    es.addEventListener(kind, (e) => {
      lastRunEvent = e.lastEventId;
      showRun(JSON.parse(e.data));
    });
  }
  es.addEventListener("reset", () => $("#runs").replaceChildren());
}

function showRun(ev) {
  const li = document.createElement("li");
  const at = new Date(ev.at).toLocaleTimeString();
  const d = ev.data;
  if (ev.type === "stats") {
    li.textContent = `${at}  stats: ${d.rooms} rooms, ${d.messages} messages`;
  } else {
    li.className = ev.type.slice(4);
    let text = `${at}  ${d.type} ${d.job} ${ev.type.slice(4)}`;
    if (d.duration) text += ` in ${d.duration}`;
    if (d.messages) text += `, ${d.messages} message(s)`;
    if (d.error) text += `: ${d.error}`;
    li.textContent = text;
  }
  $("#runs").prepend(li);
  while ($("#runs").children.length > 100) $("#runs").lastChild.remove();
}

// The mail's link opens this page with ?token=: it is good once, so it
// leaves the address bar before it signs in. Otherwise a session cookie
// from before may still work.
const linkToken = new URLSearchParams(location.search).get("token");
if (linkToken) {
  history.replaceState(null, "", location.pathname);
  verify({token: linkToken});
} else {
  start();
}
</script>
</body>
</html>
